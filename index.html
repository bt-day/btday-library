<!doctype html>
<html lang="ko">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="뷰티데이 컴포넌트 라이브러리 개발소스 저장 사이트 입니다">

        <title>BTDAY Component Library</title>
        <meta name="description" content="실무에 활용하는 반응형 UI 컴포넌트, JavaScript 인터랙션 및 AJAX 소스 라이브러리.">

        <meta property="og:type" content="website">
        <meta property="og:title" content="BTDAY Component Library">
        <meta property="og:description" content="Responsive UI · Interaction · AJAX">
        <meta property="og:image"
            content="https://bt-day.github.io/btday-library/bt_assets/images/og-favicon/btday-og.png">
        <meta property="og:url" content="https://bt-day.github.io/btday-library/">
        <link rel="icon" type="image/png" href="bt_assets/images/og-favicon/btday-p.svg">

        <meta name="twitter:card" content="summary_large_image">



        <link rel="stylesheet" as="style" crossorigin
            href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />

        <!-- Foundation :: CSS -->
        <link href="bt_css/bt_base/bt_reset.css" rel="stylesheet">
        <link href="bt_css/bt_base/bt_common.css" rel="stylesheet">
        <link href="bt_css/bt_base/bt_layouts.css" rel="stylesheet">

        <!-- Token -->
        <link href="bt_css/bt_tokens/bt_foundation_token.css" rel="stylesheet">

        <!-- Header / Footer 공통 컴포넌트 -->
        <link rel="stylesheet" href="bt_css/bt_components/bt-header-footer.css">

        <!-- 페이지 전용 CSS : 인덱스 -->
        <link rel="stylesheet" href="bt_css/bt_pages/bt_library.css">

        <!-- Main Visual Gallery -->
        <script src="bt_js/bt-gallery.js" defer></script>

    </head>

    <body>

        <div class="bt-wrapper">
            <!-- Main Visual Background -->
            <div class="bt-gallery-bg" aria-hidden="true">
                <div class="bt-gallery-bg__slide is-active"></div>
                <div class="bt-gallery-bg__slide"></div>
            </div>

            <!-- Header Include 삽입 위치 -->
            <div id="bt-header-include"></div>

            <main>
                <div class="gallery-hero">
                    <div class="main-search">
                        <form role="search" action="bt-subpage-common.html" method="get">
                            <label for="search" class="blind">라이브러리 검색</label>
                            <input id="search" type="search" name="search" placeholder="Search BTDAY Library">
                            <button type="button" class="bt-search-clear" aria-label="검색어 지우기" hidden>×</button>
                            <button type="submit" aria-label="검색"><img src="bt_assets/icon-svg/search.svg"
                                    alt="" /></button>
                        </form>
                    </div>
                    <div class="bt-hero">
                        <h3>COMPONENT</h3>
                        <h1>Build Better Components, Create Better Experiences.</h1>
                        <p>
                            Reusable components designed with clear responsibility,
                            consistent structure, and practical patterns for real-world
                            web interfaces and modern digital experiences.
                        </p>
                    </div>
                </div>
                <div class="bt-slider-progress">
                    <button class="bt-slider-progress__item" type="button" aria-label="1번 슬라이드 보기">
                        <span class="bt-slider-progress__bar"></span>
                    </button>
                    <button class="bt-slider-progress__item" type="button" aria-label="2번 슬라이드 보기">
                        <span class="bt-slider-progress__bar"></span>
                    </button>
                    <button class="bt-slider-progress__item" type="button" aria-label="3번 슬라이드 보기">
                        <span class="bt-slider-progress__bar"></span>
                    </button>
                    <button class="bt-slider-progress__item" type="button" aria-label="4번 슬라이드 보기">
                        <span class="bt-slider-progress__bar"></span>
                    </button>
                </div>
            </main>

            <section class="bt-marquee" aria-label="Featured works">
                <div class="bt-marquee-title">
                    <h3>컴포넌트 라이브러리 슬라이더</h3>
                    <p>뷰티데이 라이브러리 슬라이더 목록</p>
                </div>
                <div class="bt-marquee__viewport">
                    <div class="bt-marquee__track">
                        <div class="bt-marquee__item">
                            <a class="bt-marquee__link" href="#">
                                <img class="bt-marquee__media" src="bt_assets/images/slide/mq-img01.png"
                                    alt="Sample 01">
                            </a>
                        </div>
                        <div class="bt-marquee__item">
                            <a class="bt-marquee__link" href="#">
                                <img class="bt-marquee__media" src="bt_assets/images/slide/mq-img02.png"
                                    alt="Sample 01">
                            </a>
                        </div>
                        <div class="bt-marquee__item">
                            <a class="bt-marquee__link" href="#">
                                <img class="bt-marquee__media" src="bt_assets/images/slide/mq-img02.png"
                                    alt="Sample 01">
                            </a>
                        </div>
                        <div class="bt-marquee__item">
                            <a class="bt-marquee__link" href="#">
                                <img class="bt-marquee__media" src="bt_assets/images/slide/mq-img01.png"
                                    alt="Sample 01">
                            </a>
                        </div>
                        <div class="bt-marquee__item">
                            <a class="bt-marquee__link" href="#">
                                <img class="bt-marquee__media" src="bt_assets/images/slide/mq-img02.png"
                                    alt="Sample 01">
                            </a>
                        </div>
                        <div class="bt-marquee__item">
                            <a class="bt-marquee__link" href="#">
                                <img class="bt-marquee__media" src="bt_assets/images/slide/mq-img03.png"
                                    alt="Sample 01">
                            </a>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Footer Include 삽입 위치 -->
            <div id="bt-footer-include"></div>

        </div>


        <script src="bt_js/bt-header.js"></script>
        <script src="bt_js/bt-mobile-nav.js"></script>
        <script src="bt_js/bt-include.js"></script>

        <!-- Index 검색 UI -->
        <script src="bt_js/bt-index-search.js"></script>

        <!-- Rolling Marquee -->
        <script src="bt_js/bt-marquee.js"></script>

    </body>

</html>
