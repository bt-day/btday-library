<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>로그인 폼01번</title>

        <link rel="stylesheet" as="style" crossorigin
            href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />

        <!-- Foundation :: CSS -->
        <link href="css/mjm_reset.css" rel="stylesheet">
        <link href="css/mjm_foundation_token.css" rel="stylesheet">
        <!-- Token -->
        <link href="css/a01-login.css" rel="stylesheet">


    </head>

    <body>
        <div class="login-wrap">
            <section class="login-group">
                <div class="login-group-inner">
                    <div class="eyebrow-icon"></div>
                    <div class="login-group-title">
                        <h1>Welcome back</h1>
                        <p>Please enter your details to sign in to your account.</p>
                    </div>
                    <form>
                        <div class="login-field">
                            <label for="email">Email</label>
                            <input id="email" type="email" name="email" placeholder="name@company.com">
                        </div>
                        <div class="login-field">
                            <div class="login-field-head">
                                <label for="password">Password</label>
                                <a href="#">Forgot password?</a>
                            </div>
                            <input id="password" type="password" name="password" placeholder="......">
                        </div>
                        <button type="submit" class="login-sign-in">Sign in</button>
                    </form>
                    <p class="login-sign-up">
                        Don't have an account?
                        <a href="#" class="login-sign-up-link">Sign up</a>
                    </p>
                </div>
            </section>
        </div>
    </body>

</html>
