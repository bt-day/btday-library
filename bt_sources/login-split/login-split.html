<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>a03 로그인 폼</title>

        <link rel="stylesheet" as="style" crossorigin
            href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />

        <!-- Foundation :: CSS -->
        <link href="css/mjm_reset.css" rel="stylesheet">
        <link href="css/mjm_foundation_token.css" rel="stylesheet">
        <!-- Token -->
        <link href="css/login-split.css" rel="stylesheet">


    </head>

    <body>

        <div class="a03-login-wrapper">
            <!-- background decoration -->
            <div class="a03-bg" aria-hidden="true">
                <span class="a03-bg__shape a03-bg__shape--01"></span>
                <span class="a03-bg__shape a03-bg__shape--02"></span>
                <span class="a03-bg__shape a03-bg__shape--03"></span>
                <span class="a03-bg__shape a03-bg__shape--04"></span>
            </div>
            <!--  로그인 콘텐츠 -->
            <section class="a03-login">
                <div class="a03-login-left">
                    <div class="a03-login-left-inner">
                        <div class="eyebrow-icon">BT</div>
                        <div class="login-group-title">
                            <h1>Welcome Back</h1>
                            <p>Sign in to your account to continue</p>
                        </div>
                        <form>
                            <div class="a03-login-field">
                                <img src="img/mail.svg" alt="" />
                                <input id="email" type="email" name="email" placeholder="Email address">
                            </div>
                            <div class="a03-login-field-group">
                                <div class="a03-login-field02">
                                    <img src="img/lock-password.svg" alt="" />
                                    <input id="password" type="password" name="password" placeholder="Password">
                                </div>
                                <button type="submit" class="eye-show"><img src="img/eye.svg" alt="" /></button>
                            </div>
                            <div class="a03-checkbox-password">
                                <label class="checkbox-group">
                                    <input type="checkbox" name="Remember">
                                    <span>Remember me</span>
                                </label>
                                <a href="#">Forgot password?</a>
                            </div>
                            <button type="submit" class="a03-login-sign-btn">Sign In</button>
                        </form>
                        <div class="a03-login-unline">
                            <div class="unline"></div>
                            <p>or continue with</p>
                            <div class="unline"></div>
                        </div>
                        <div class="a03-login-social-button">
                            <a href="#" class="social-button">
                                <img src="img/naver.svg" class="" alt="" />
                            </a>
                            <a href="#" class="social-button">
                                <img src="img/kakao.svg" class="" alt="" />
                            </a>
                            <a href="#" class="social-button">
                                <img src="img/google.svg" class="" alt="" />
                            </a>
                        </div>
                        <p class="a03-login-sign-up">
                            Don't have an account?
                            <a href="#" class="sign-up-link">Sign up</a>
                        </p>
                    </div>
                </div>
                <div class="a03-login-right">
                    <div class="a03-login-right-inner">
                        <div class="a03-login-right-title">
                            <h2>Build Your Better Tomorrow</h2>
                            <p>Join our community and explore a more productive, organized and inspired you.</p>
                        </div>
                        <p class="a03-login-right-bottom-text">" Small steps make big changes. "</p>
                    </div>
                </div>
            </section>
        </div>



    </body>

</html>
