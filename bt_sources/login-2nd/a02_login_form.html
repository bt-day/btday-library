<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>02 로그인 폼</title>

        <link rel="stylesheet" as="style" crossorigin
            href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />

        <!-- Foundation :: CSS -->
        <link href="css/mjm_reset.css" rel="stylesheet">
        <link href="css/mjm_foundation_token.css" rel="stylesheet">
        <!-- Token -->
        <link href="css/a02-login.css" rel="stylesheet">

    </head>

    <body>

        <div class="a02-login-wrapper">
            <section class="a02-login">
                <div class="a02-login-inner">
                    <div class="a02-login-title">
                        <h1>Welcome Back</h1>
                        <p>Sign in to your account to continue</p>
                    </div>
                    <form>
                        <div class="a02-login-field">
                            <label for="email">Email</label>
                            <div class="a02-login-field-inner-group">
                                <img src="img/mail.svg" alt="" />
                                <input id="email" type="email" name="email" placeholder="name@company.com">
                            </div>
                        </div>
                        <div class="a02-login-field">
                            <div class="a02-login-field-head">
                                <label for="Password">Password</label>
                                <a href="#">Forgot password?</a>
                            </div>
                            <div class="a02-login-field-inner-group02">
                                <div class="field-inner-left">
                                    <img src="img/lock-password.svg" alt="" />
                                    <input id="Password" type="Password" name="Password"
                                        placeholder="Enter your password">
                                </div>
                                <button type="button" class="field-inner-right">
                                    <img src="img/eye.svg" alt="" />
                                </button>
                            </div>
                        </div>
                        <label class="checkbox-group">
                            <input type="checkbox" name="Remember">
                            <span>Remember me</span>
                        </label>
                        <button class="a02-login-sign-btn" type="submit">Sign in &nbsp;&nbsp;→</button>
                    </form>
                    <div class="a02-login-unline">
                        <div class="unline"></div>
                        <p>or continue with</p>
                        <div class="unline"></div>
                    </div>
                    <div class="a02-login-social-button">
                        <a href="#" class="social-button">
                            <img src="img/naver.svg" class="" alt="" />
                            <span>Naver</span>
                        </a>
                        <a href="#" class="social-button">
                            <img src="img/kakao.svg" class="" alt="" />
                            <span>Kakao</span>
                        </a>
                        <a href="#" class="social-button">
                            <img src="img/google.svg" class="" alt="" />
                            <span>Google</span>
                        </a>
                    </div>
                    <p class="a02-login-sign-up">
                        Don't have an account?
                        <a href="#" class="sign-up-link">Sign up</a>
                    </p>
                </div>
            </section>
        </div>


    </body>

</html>
